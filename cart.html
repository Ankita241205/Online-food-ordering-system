<!DOCTYPE html>
<html>
<head>
    <title>Cart</title>

    <style>
        body {
            font-family: Arial;
            background: linear-gradient(to right, #ffecd2, #fcb69f);
            text-align: center;
            padding-top: 80px;
        }

        .box {
            background: white;
            width: 500px;
            margin: auto;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.2);
        }

        h2 {
            color: green;
        }

        .item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #f5f5f5;
            margin: 10px 0;
            padding: 10px;
            border-radius: 10px;
        }

        .controls button {
            margin: 0 3px;
            padding: 5px 10px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
        }

        .add {
            background: green;
            color: white;
        }

        .remove {
            background: orange;
            color: white;
        }

        .delete {
            background: red;
            color: white;
        }

        .total {
            margin-top: 15px;
            font-weight: bold;
            font-size: 22px;
        }

        .btn {
            display: inline-block;
            margin-top: 20px;
            text-decoration: none;
            background: #ff7a18;
            color: white;
            padding: 12px 25px;
            border-radius: 25px;
            font-size: 20px;
        }

        .btn:hover {
            background: #ff4b2b;
        }
    </style>
</head>

<body>

<div class="box">
    <h2>Your Cart</h2>

    <div id="cartItems"></div>

    <div class="total" id="totalItems"></div>

    <a href="order.html" class="btn">Proceed to Order</a>
</div>

<script>
let cart = JSON.parse(localStorage.getItem("cart")) || [];

// Fix old or broken cart data
cart = cart
    .filter(item => item) // remove null/undefined items
    .map(item => {

        // If old format is string
        if (typeof item === "string") {
            return {
                name: item,
                qty: 1
            };
        }

        // If object but missing values
        return {
            name: item.name || "Unknown Item",
            qty: parseInt(item.qty) || 1
        };
    });

// Save cleaned cart
localStorage.setItem("cart", JSON.stringify(cart));

function displayCart() {

    let container = document.getElementById("cartItems");
    let total = document.getElementById("totalItems");

    container.innerHTML = "";

    if (cart.length === 0) {
        container.innerHTML = "<p>Your cart is empty</p>";
        total.innerHTML = "";
        return;
    }

    let totalCount = 0;

    cart.forEach((item, index) => {

        totalCount += item.qty;

        container.innerHTML += `
            <div class="item">
                <span>${item.name} (x${item.qty})</span>

                <div class="controls">
                    <button class="add" onclick="changeQty(${index}, 1)">+</button>

                    <button class="remove" onclick="changeQty(${index}, -1)">-</button>

                    <button class="delete" onclick="removeItem(${index})">
                        Remove
                    </button>
                </div>
            </div>
        `;
    });

    total.innerHTML = "Total Items: " + totalCount;
}

function changeQty(index, change) {

    cart[index].qty += change;

    if (cart[index].qty <= 0) {
        cart.splice(index, 1);
    }

    localStorage.setItem("cart", JSON.stringify(cart));

    displayCart();
}

function removeItem(index) {

    cart.splice(index, 1);

    localStorage.setItem("cart", JSON.stringify(cart));

    displayCart();
}

displayCart();
</script>

</body>
</html>
